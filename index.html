    <style>

        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --success: #16a34a;
            --danger: #dc2626;

            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;

            --shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            --nav:
                rgba(255, 255, 255, 0.95);
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --border: #334155;

            --nav:
                rgba(15, 23, 42, 0.95);

            --shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);
            color: var(--text);
            line-height: 1.7;

            transition:

                color 0.3s ease;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: var(--nav);

            backdrop-filter: blur(12px);

            border-bottom:
                1px solid var(--border);
        }

        .nav-container {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;

            color: var(--primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;

            flex-wrap: wrap;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .theme-btn {
            border: none;

            background: var(--primary);
            color: white;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 17px;
        }

        /* ================= HERO ================= */

        .hero {
            padding: 90px 0 70px;

            text-align: center;

            background:
                radial-gradient(
                    circle at top,
                    rgba(37, 99, 235, 0.15),
                    transparent 45%
                );
        }

        .profile-photo {
            width: 190px;
            height: 190px;

            margin: 0 auto 25px;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 7px solid white;

            box-shadow: var(--shadow);
        }

        .availability {
            display: inline-block;

            padding: 7px 15px;

            border-radius: 30px;

            background:
                rgba(22, 163, 74, 0.12);

            color: var(--success);

            font-weight: 700;

            font-size: 14px;

            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 62px);

            line-height: 1.1;

            margin-bottom: 15px;
        }

        .hero h2 {
            color: var(--primary);

            font-size:
                clamp(20px, 3vw, 30px);

            margin-bottom: 18px;
        }

        .hero p {
            max-width: 720px;

            margin: auto;

            color: var(--muted);

            font-size: 17px;
        }

        .hero-buttons {
            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            padding: 12px 22px;

            border-radius: 10px;

            font-weight: 700;

            cursor: pointer;

            border: none;

            transition: 0.25s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-outline {
            border:
                2px solid var(--primary);

            color: var(--primary);

            background: transparent;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        /* ================= SECTIONS ================= */

        section {
            padding: 75px 0;
        }

        .section-title {
            text-align: center;

            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 34px;

            margin-bottom: 10px;
        }

        .section-title p {
            color: var(--muted);
        }

        /* ================= CARDS ================= */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 22px;
        }

        .card {
            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 18px;

            padding: 28px;

            box-shadow: var(--shadow);

            transition:
                transform 0.25s ease,
                border 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(37, 99, 235, 0.45);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: var(--muted);
        }

        /* ================= ABOUT ================= */

        .about-grid {
            display: grid;

            grid-template-columns:
                1.2fr 0.8fr;

            gap: 25px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 10px 0;

            border-bottom:
                1px solid var(--border);
        }

        .info-list strong {
            display: inline-block;

            min-width: 110px;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-top: 25px;
        }

        .stat {
            text-align: center;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 16px;

            padding: 25px;
        }

        .stat strong {
            display: block;

            font-size: 32px;

            color: var(--primary);
        }

        .stat span {
            color: var(--muted);
        }

        /* ================= SKILLS ================= */

        .skill {
            margin-bottom: 20px;
        }

        .skill-top {
            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;

            font-weight: 700;
        }

        .skill-bar {
            width: 100%;

            height: 11px;

            background:
                rgba(100, 116, 139, 0.2);

            border-radius: 20px;

            overflow: hidden;
        }

        .skill-fill {
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--secondary)
                );

            border-radius: inherit;
        }

        /* ================= SERVICES ================= */

        .service-icon {
            width: 50px;
            height: 50px;

            display: grid;

            place-items: center;

            border-radius: 13px;

            background:
                rgba(37, 99, 235, 0.12);

            color: var(--primary);

            font-size: 23px;

            margin-bottom: 15px;
        }

        /* ================= PROJECTS ================= */

        .project-card {
            display: flex;

            flex-direction: column;
        }

        .project-card .project-tag {
            display: inline-block;

            align-self: flex-start;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;

            background:
                rgba(124, 58, 237, 0.12);

            color: var(--secondary);

            margin-bottom: 14px;
        }

        .project-card .project-content {
            flex: 1;
        }

        .project-card .btn {
            margin-top: 20px;
        }

        /* ================= WORKFLOW ================= */

        .workflow {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;
        }

        .step {
            text-align: center;

            padding: 22px 15px;

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 15px;
        }

        .step-number {
            width: 42px;
            height: 42px;

            display: grid;

            place-items: center;

            margin: 0 auto 12px;

            border-radius: 50%;

            background: var(--primary);

            color: white;

            font-weight: 800;
        }

        /* ================= PRICING ================= */

        .price {
            font-size: 32px;

            color: var(--primary);

            font-weight: 800;

            margin: 15px 0;
        }

        .price small {
            font-size: 14px;

            color: var(--muted);

            font-weight: normal;
        }

        .price-list {
            list-style: none;

            margin: 20px 0;
        }

        .price-list li {
            padding: 7px 0;
        }

        /* ================= TOOLS ================= */

        .tool-box {
            max-width: 650px;

            margin: auto;
        }

        .calculator-display {
            width: 100%;

            padding: 15px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--bg);

            color: var(--text);

            font-size: 20px;

            margin-bottom: 15px;
        }

        .calc-inputs {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 13px 14px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--bg);

            color: var(--text);

            font-size: 15px;

            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--primary);
        }

        .calc-buttons {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 10px;

            margin-top: 15px;
        }

        .calc-buttons button {
            border: none;

            padding: 13px;

            border-radius: 10px;

            background: var(--primary);

            color: white;

            cursor: pointer;

            font-weight: 700;
        }

        /* ================= TODO ================= */

        .todo-row {
            display: flex;

            gap: 10px;

            margin-bottom: 15px;
        }

        .todo-list {
            list-style: none;
        }

        .todo-list li {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 12px;

            margin-bottom: 8px;

            background: var(--bg);

            border-radius: 10px;
        }

        .todo-list button {
            border: none;

            background: var(--danger);

            color: white;

            padding: 6px 10px;

            border-radius: 7px;

            cursor: pointer;
        }

        /* ================= FAQ ================= */

        .faq {
            max-width: 850px;

            margin: auto;
        }

        .faq-item {
            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 12px;

            margin-bottom: 12px;

            overflow: hidden;
        }

        .faq-question {
            width: 100%;

            border: none;

            background: transparent;

            color: var(--text);

            padding: 18px;

            text-align: left;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        .faq-answer {
            display: none;

            padding: 0 18px 18px;

            color: var(--muted);
        }

        .faq-item.active .faq-answer {
            display: block;
        }

        /* ================= CONTACT ================= */

        .contact-grid {
            display: grid;

            grid-template-columns:
                0.8fr 1.2fr;

            gap: 25px;
        }

        .contact-form {
            display: grid;

            gap: 13px;
        }

        .contact-info div {
            margin-bottom: 17px;
        }

        .contact-info strong {
            display: block;

            color: var(--primary);
        }

        /* ================= FOOTER ================= */

        footer {
            padding: 35px 0;

            text-align: center;

            border-top:
                1px solid var(--border);

            color: var(--muted);
        }

        .footer-links {
            margin-top: 10px;

            display: flex;

            justify-content: center;

            gap: 18px;

            flex-wrap: wrap;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        /* ================= WHATSAPP ================= */

        .whatsapp {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 58px;
            height: 58px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background: #25d366;

            color: white;

            font-size: 27px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.2);

            z-index: 999;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 850px) {

            .nav-container {
                flex-direction: column;

                padding: 15px 0;
            }

            .nav-links {
                justify-content: center;
            }

            .about-grid,
            .contact-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .workflow {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            section {
                padding: 55px 0;
            }

            .hero {
                padding: 60px 0 50px;
            }

            .profile-photo {
                width: 155px;
                height: 155px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                font-size: 12px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .workflow {
                grid-template-columns: 1fr;
            }

            .calc-inputs {
                grid-template-columns: 1fr;
            }

            .calc-buttons {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .todo-row {
                flex-direction: column;
            }

            .hero-buttons {
                flex-direction: column;
            }

            .hero-buttons .btn {
                width: 100%;
            }
        }

    </style>
</head>
