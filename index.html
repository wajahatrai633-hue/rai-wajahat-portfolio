    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --dark: #0f172a;
            --text: #334155;
            --light: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --success: #16a34a;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--light);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }

        /* NAVBAR */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--dark);
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .theme-btn {
            border: none;
            background: var(--dark);
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        /* HERO */

        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            background:
                radial-gradient(circle at top right, rgba(37,99,235,0.15), transparent 35%),
                radial-gradient(circle at bottom left, rgba(124,58,237,0.12), transparent 35%);
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 50px;
            align-items: center;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 7px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.1;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--primary);
        }

        .hero h2 {
            font-size: 22px;
            margin-bottom: 18px;
            color: #475569;
        }

        .hero p {
            font-size: 17px;
            max-width: 650px;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: bold;
            border: 2px solid var(--primary);
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-outline {
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        /* PROFILE */

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .profile-photo {
            width: 190px;
            height: 190px;
            margin: auto;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 7px solid white;
            box-shadow: var(--shadow);
        }

        .profile-card h3 {
            margin-top: 20px;
            color: var(--dark);
            font-size: 24px;
        }

        .profile-card p {
            color: #64748b;
        }

        /* SECTIONS */

        section {
            padding: 90px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 38px;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .section-title p {
            color: #64748b;
        }

        /* ABOUT */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card h3 {
            color: var(--dark);
            margin-bottom: 15px;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-list strong {
            color: var(--dark);
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .stat h3 {
            font-size: 32px;
            color: var(--primary);
        }

        .stat p {
            color: #64748b;
        }

        /* SKILLS */

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .skill {
            margin-bottom: 20px;
        }

        .skill-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .skill-bar {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .skill-fill {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                var(--primary),
                var(--secondary)
            );
        }

        /* SERVICES */

        .services-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .service {
            background: white;
            padding: 30px 22px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .service:hover {
            transform: translateY(-5px);
        }

        .service-icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .service h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .service p {
            color: #64748b;
            font-size: 14px;
        }

        /* PROJECTS */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .project {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .project-top {
            padding: 28px;
            background: linear-gradient(
                135deg,
                rgba(37,99,235,0.12),
                rgba(124,58,237,0.12)
            );
            font-size: 42px;
        }

        .project-content {
            padding: 25px;
        }

        .project h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .project p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 18px;
        }

        /* WORKFLOW */

        .workflow {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .step {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .step-number {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-weight: bold;
        }

        .step h3 {
            color: var(--dark);
            margin-bottom: 8px;
        }

        .step p {
            color: #64748b;
            font-size: 14px;
        }

        /* PRICING */

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .price-card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .price-card.featured {
            border: 2px solid var(--primary);
            transform: translateY(-5px);
        }

        .price-card h3 {
            color: var(--dark);
            margin-bottom: 10px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        .price-card ul {
            list-style: none;
            margin: 20px 0;
        }

        .price-card li {
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }

        /* FAQ */

        .faq {
            max-width: 850px;
            margin: auto;
        }

        .faq-item {
            background: white;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .faq-question {
            width: 100%;
            border: none;
            background: white;
            color: var(--dark);
            padding: 18px 20px;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .faq-answer {
            display: none;
            padding: 0 20px 20px;
            color: #64748b;
        }

        .faq-item.active .faq-answer {
            display: block;
        }

        /* CONTACT */

        .contact-grid {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 30px;
        }

        .contact-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .contact-box h3 {
            color: var(--dark);
            margin-bottom: 15px;
        }

        .contact-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .contact-item strong {
            color: var(--dark);
        }

        form {
            display: grid;
            gap: 15px;
        }

        form input,
        form textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        form input:focus,
        form textarea:focus {
            border-color: var(--primary);
        }

        form textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* WHATSAPP */

        .whatsapp {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 55px;
            height: 55px;
            background: #25D366;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            box-shadow: var(--shadow);
            z-index: 999;
        }

        /* FOOTER */

        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        footer p {
            margin: 5px 0;
        }

        /* DARK MODE */

        body.dark {
            --light: #020617;
            --dark: #f8fafc;
            --text: #cbd5e1;
            --white: #0f172a;
            --border: #1e293b;
        }

        body.dark nav,
        body.dark .card,
        body.dark .stat,
        body.dark .service,
        body.dark .project,
        body.dark .step,
        body.dark .price-card,
        body.dark .faq-item,
        body.dark .contact-box,
        body.dark .profile-card {
            background: #0f172a;
        }

        body.dark .faq-question {
            background: #0f172a;
            color: #f8fafc;
        }

        body.dark form input,
        body.dark form textarea {
            background: #020617;
            color: white;
        }

        /* MOBILE */

        @media (max-width: 900px) {

            .nav-links {
                display: none;
            }

            .hero-content,
            .about-grid,
            .contact-grid,
            .skills-grid {
                grid-template-columns: 1fr;
            }

            .services-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .workflow {
                grid-template-columns: repeat(2, 1fr);
            }

            .pricing-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .profile-card {
                max-width: 400px;
                margin: auto;
            }
        }

        @media (max-width: 550px) {

            section {
                padding: 65px 0;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }

            .workflow {
                grid-template-columns: 1fr;
            }

            .hero {
                min-height: auto;
                padding: 70px 0;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .hero h1 {
                font-size: 42px;
            }

            .profile-photo {
                width: 150px;
                height: 150px;
            }
        }

    </style>

</head>
